    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ``--max-tasks-per-child=50`` recycles each forked worker process
    # after 50 tasks.  Catches slow memory leaks in long-lived task code
    # (httpx connection pools, sqlalchemy session caches, anthropic SDK
    # state) before they accumulate into a hard OOM kill (exit 137,
    # which is what knocked the worker over on 2026-06-08).
    command: celery -A app.workers.celery_app worker --loglevel=info --max-tasks-per-child=50
    # 1.5GB hard ceiling so a single misbehaving task can't take down the
    # whole worker.  Combined with --max-tasks-per-child this is
    # belt-and-suspenders against the OOM kill failure mode.
    mem_limit: 1536m
    # Auto-recover from any container death (incl. a cgroup OOM kill of
    # the celery parent).  Without this, the mem_limit above makes the
    # 2026-06-08 dead-worker outage MORE likely, not less — the limit
    # invites the kill and nothing restarts the container afterward.
    restart: unless-stopped
    environment:
