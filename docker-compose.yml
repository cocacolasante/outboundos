      IRS_BMF_RULING_LOOKBACK_MONTHS: ${IRS_BMF_RULING_LOOKBACK_MONTHS:-2}
      FUNDING_DISCOVERY_MAX_PER_RUN: ${FUNDING_DISCOVERY_MAX_PER_RUN:-25}
