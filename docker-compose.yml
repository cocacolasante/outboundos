services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emailblaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emailblaster}
      POSTGRES_DB: ${POSTGRES_DB:-emailblaster}
    ports:
      # localhost-only — db/redis/backend are unauthenticated; LAN exposure
      # = unauthenticated lead access + token spend.  Tunnel
      # (ngrok/cloudflared) still reaches /webhooks/* because it forwards
      # via the host loopback.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emailblaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emailblaster}:${POSTGRES_PASSWORD:-emailblaster}@postgres:5432/${POSTGRES_DB:-emailblaster}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_RESEARCH_MODEL: ${ANTHROPIC_RESEARCH_MODEL:-claude-haiku-4-5-20251001}
      RESEARCH_WEB_SEARCH_MAX_USES: ${RESEARCH_WEB_SEARCH_MAX_USES:-1}
      ANTHROPIC_RESEARCH_CLIENT_MODEL: ${ANTHROPIC_RESEARCH_CLIENT_MODEL:-claude-haiku-4-5-20251001}
      RESEARCH_CLIENT_FAST_WEB_SEARCH_MAX_USES: ${RESEARCH_CLIENT_FAST_WEB_SEARCH_MAX_USES:-2}
      RESEARCH_CLIENT_DEEP_WEB_SEARCH_MAX_USES: ${RESEARCH_CLIENT_DEEP_WEB_SEARCH_MAX_USES:-5}
      ANTHROPIC_SOCIAL_DISCOVERY_MODEL: ${ANTHROPIC_SOCIAL_DISCOVERY_MODEL:-claude-haiku-4-5-20251001}
      SOCIAL_DISCOVERY_WEB_SEARCH_MAX_USES: ${SOCIAL_DISCOVERY_WEB_SEARCH_MAX_USES:-3}
      LINKEDIN_DISCOVERY_MODEL: ${LINKEDIN_DISCOVERY_MODEL:-claude-sonnet-4-6}
      LINKEDIN_DISCOVERY_WEB_SEARCH_MAX_USES: ${LINKEDIN_DISCOVERY_WEB_SEARCH_MAX_USES:-5}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@example.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Email Blaster}
      EMAIL_CLICK_TRACKING_ENABLED: ${EMAIL_CLICK_TRACKING_ENABLED:-true}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-us}
      USASPENDING_ENABLED: ${USASPENDING_ENABLED:-false}
      USASPENDING_LOOKBACK_DAYS: ${USASPENDING_LOOKBACK_DAYS:-30}
      USASPENDING_MAX_AWARD_AMOUNT: ${USASPENDING_MAX_AWARD_AMOUNT:-500000}
      IRS_BMF_ENABLED: ${IRS_BMF_ENABLED:-false}
      IRS_BMF_STATES: ${IRS_BMF_STATES:-}
      IRS_BMF_RULING_LOOKBACK_MONTHS: ${IRS_BMF_RULING_LOOKBACK_MONTHS:-2}
      FUNDING_DISCOVERY_MAX_PER_RUN: ${FUNDING_DISCOVERY_MAX_PER_RUN:-25}
      FUNDING_SCRAPE_MAX_PAGES: ${FUNDING_SCRAPE_MAX_PAGES:-6}
