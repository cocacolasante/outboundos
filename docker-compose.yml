      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PLATFORM_BREVO_API_KEY: ${PLATFORM_BREVO_API_KEY:-}
      PLATFORM_SENDER_EMAIL: ${PLATFORM_SENDER_EMAIL:-}
