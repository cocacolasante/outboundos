      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-true}
      CIRCUIT_BREAKER_MIN_SAMPLE: ${CIRCUIT_BREAKER_MIN_SAMPLE:-20}
      CIRCUIT_BREAKER_BOUNCE_RATE: ${CIRCUIT_BREAKER_BOUNCE_RATE:-0.05}
      CIRCUIT_BREAKER_SPAM_RATE: ${CIRCUIT_BREAKER_SPAM_RATE:-0.001}
