      BREVO_WEBHOOK_SECRET: ${BREVO_WEBHOOK_SECRET:-}
      BREVO_WEBHOOK_AUTH_HEADER: ${BREVO_WEBHOOK_AUTH_HEADER:-X-Brevo-Auth}
      SOFT_BOUNCE_SUPPRESS_THRESHOLD: ${SOFT_BOUNCE_SUPPRESS_THRESHOLD:-1}
      LINKEDIN_DAILY_ACTION_CAP: ${LINKEDIN_DAILY_ACTION_CAP:-20}
      LINKEDIN_DAILY_CONNECT_CAP: ${LINKEDIN_DAILY_CONNECT_CAP:-20}
      LINKEDIN_DAILY_DM_CAP: ${LINKEDIN_DAILY_DM_CAP:-30}
      LINKEDIN_MIN_ACTION_DELAY_SECONDS: ${LINKEDIN_MIN_ACTION_DELAY_SECONDS:-30}
